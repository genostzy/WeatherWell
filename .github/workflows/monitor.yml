name: Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# A failed scheduled run emails the repository owner. That email is the alert.
# Lives on v1, the default branch: GitHub runs schedules only from there, so
# the copy on main never ran.
env:
  HEALTH_URL: https://weatherwell.vercel.app/api/health
  HOME_URL: https://weatherwell.vercel.app/

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/check-health.mjs
      # Supabase's pg_cron starts this workflow on time, with a GitHub token in
      # Vault (PRD Setup step 10). An expired or revoked token fails silently,
      # leaving only GitHub's own late schedule, so a scheduled run fails, and
      # emails the owner, once no on-time run has come for an hour. A run
      # Supabase started is itself the proof the token works, so it skips this.
      # GitHub's run list can lag (on 1 October three on-time runs read the
      # newest as 17 hours old), so it takes the newest of the last 20 and
      # looks once more before failing.
      - name: Supabase still starts the scheduled runs
        if: ${{ always() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow monitor.yml --event workflow_dispatch --limit 20 \
              --json createdAt --jq '[.[].createdAt] | max // empty'
          }
          age_of() { echo $(( $(date +%s) - $(date -d "$1" +%s) )); }
          last=$(newest)
          if [ -z "$last" ]; then
            echo "No run has been started by Supabase yet: see PRD Setup step 10."
            exit 1
          fi
          if [ "$(age_of "$last")" -gt 3600 ]; then
            sleep 30
            last=$(newest)
            age=$(age_of "$last")
            if [ "$age" -gt 3600 ]; then
              echo "No on-time run from Supabase for $((age / 60)) minutes: renew github_workflow_token in Vault (PRD Setup step 10)."
              exit 1
            fi
          fi
