name: CI

on:
  push:
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches local development. Next 16 itself needs >=20.9.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # Guards the clean baseline: unused files, exports, and dependencies.
      - run: npm run knip

      - run: npm run build

  # Rebuilds the database from supabase/migrations alone, then runs the RLS
  # and engine tests and the abuse-attempt suite against it. Catches a
  # migration that only works on the live database (M2) and any policy or
  # grant regression. Free: the local Supabase stack runs in the runner's own
  # Docker.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start a local Supabase from the repo's migrations and seed
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor

      - name: Run the database tests
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          for f in supabase/tests/helpers.sql supabase/tests/reference-tables.sql supabase/tests/rls.sql supabase/tests/abuse.sql; do
            echo "== $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
