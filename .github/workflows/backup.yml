name: Backup

on:
  schedule:
    # Sundays 18:30 UTC, which is 02:30 on Monday in the Philippines.
    - cron: "30 18 * * 0"
  workflow_dispatch:

# A weekly copy of the live database, kept away from Supabase: the free plan
# keeps no backups, and migrations go straight to the live database. Supabase's
# pg_cron starts this on time (20260929144202_dispatch_backup); the schedule
# above is the fallback. The copy is encrypted before it leaves the runner,
# because anyone signed in to GitHub can download this public repository's
# artifacts. A failed run emails the owner. Restoring: README, "Backups".
concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Supabase's own recipe (docs: Backup and Restore using the CLI): roles,
      # schema and data as separate files, plus the migration history.
      - name: Dump the roles, the schema, the data and the migration history
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add the SUPABASE_DB_URL secret (README, Backups)."
            exit 1
          fi
          mkdir backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --use-copy --data-only -x "storage.buckets_vectors" -x "storage.vector_indexes"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/history_schema.sql --schema supabase_migrations
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/history_data.sql --use-copy --data-only --schema supabase_migrations
          ls -l backup

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add the BACKUP_PASSPHRASE secret (README, Backups)."
            exit 1
          fi
          name="weatherwell-$(date -u +%Y-%m-%d)-run${GITHUB_RUN_NUMBER}"
          tar czf "$name.tar.gz" backup
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "$name.tar.gz.gpg" "$name.tar.gz"
          rm -rf backup "$name.tar.gz"
          echo "BACKUP_FILE=$name.tar.gz.gpg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.BACKUP_FILE }}
          archive: false
          retention-days: 30
          if-no-files-found: error
